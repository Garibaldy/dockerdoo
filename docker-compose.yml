version: "3.7"

networks:
  default:
    external:
      name: cloudbuild
  odoonet:
    ipam:
      config:
        - subnet: ${DOCKER_ODONET_SUBNET:-172.21.0.0/16}

volumes:
  odoo-data:
  odoo-testlogs:
  odoo-modules:
  psql:

services:
  odoo:
    image: iterativodo/dockerdoo:${ODOO_VERSION}
    env_file: .env

    environment:
      POSTGRES_ADMIN_USER: ""
      POSTGRES_ADMIN_PASSWORD: ""
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      LIST_DB: ${LIST_DB:-False}

    restart: unless-stopped

    ports: ["8071:8069", "8075:8072"]

    volumes:
      - odoo-data:${ODOO_DATA_DIR}
      - odoo-testlogs:${ODOO_LOGS_DIR}
      # - odoo-modules:${ODOO_EXTRA_ADDONS}
      # Host paths (odoo modules, src code & conf)
      - ./custom:${ODOO_EXTRA_ADDONS}:delegated
      - ./resources/getaddons4.py:/getaddons.py:ro
      - ./resources/entrypoint.sh:/entrypoint.sh:ro
      - ./resources/requirements-ecf.txt:/resources/requirements-ecf.txt:ro
      - ./resources/certfe-modules-installed.txt:/resources/certfe-modules-installed.txt:ro
      - ./resources/scripts:/resources/scripts:ro
    depends_on:
      db:
        condition: service_healthy

    networks:
      odoonet:

  playwright-ecf:
    build:
      context: ./custom/addonsEP16/certificacion_ecf/services
      dockerfile: Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
        DGII_SIGNER_REF: ${DGII_SIGNER_REF:-main}
    hostname: playwright-ecf
    restart: unless-stopped
    environment:
      PLAYWRIGHT_SERVICE_PORT: "8765"
      PLAYWRIGHT_HEADLESS: "true"
      ASPNETCORE_URLS: "http://0.0.0.0:5000"
      ASPNETCORE_ENVIRONMENT: Production
      DGII_SIGNER_DIR: /app/dgiisigner
    shm_size: "1gb"
    volumes:
      - ./custom/addonsEP16/certificacion_ecf/services/playwright_service.py:/app/playwright_service.py:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      odoonet:

  # ------------------------
  db:
    image: postgres:${PSQL_VERSION}
    restart: unless-stopped
    volumes:
      - psql:/var/lib/postgresql/data/pgdata
      - ./resources/postgres-init:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      - POSTGRES_USER=${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER}
      - POSTGRES_APP_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_APP_USER=${POSTGRES_USER:?set POSTGRES_USER}
      - PGDATA=/var/lib/postgresql/data/pgdata
      - DOCKER_ODONET_SUBNET=${DOCKER_ODONET_SUBNET:-172.21.0.0/16}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'PGPASSWORD="$${POSTGRES_APP_PASSWORD}" psql -h localhost -U "$${POSTGRES_APP_USER}" -d postgres -v ON_ERROR_STOP=1 -qAtc "SELECT COALESCE(bool_and(NOT rolsuper AND rolcreatedb AND NOT rolcreaterole AND NOT rolreplication AND NOT rolbypassrls AND NOT pg_has_role(current_user, ''pg_execute_server_program'', ''MEMBER'') AND NOT pg_has_role(current_user, ''pg_read_server_files'', ''MEMBER'') AND NOT pg_has_role(current_user, ''pg_write_server_files'', ''MEMBER'')), false) FROM pg_roles WHERE rolname = current_user" | grep -qx t',
        ]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      odoonet:
