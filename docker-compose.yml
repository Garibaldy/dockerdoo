networks:
  odoonet:
    ipam:
      config:
        - subnet: ${DOCKER_ODONET_SUBNET:-172.28.0.0/16}

services:
  odoo:
    image: iterativodo/dockerdoo:${ODOO_VERSION}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ODOO_VERSION=${ODOO_VERSION}
        - PYTHON_VERSION=${PYTHON_VERSION}
        - OS_VARIANT=${OS_VARIANT}
        - WKHTMLTOX_VERSION=${WKHTMLTOX_VERSION}
    env_file: .env

    restart: unless-stopped

    ports:
      - 8069:8069
      - 8072:8072

    volumes:
      - odoo-data:${ODOO_DATA_DIR}
      - odoo-testlogs:${ODOO_LOGS_DIR}
      - odoo-modules:${ODOO_EXTRA_ADDONS}
    depends_on:
      db:
        condition: service_healthy

    networks:
      odoonet:
  # ------------------------
  db:
    image: postgres:${PSQL_VERSION}
    restart: always
    volumes:
      - psql:/var/lib/postgresql/data/pgdata
      - ./resources/postgres-init:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?set POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      - POSTGRES_USER=${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER}
      - POSTGRES_APP_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_APP_USER=${POSTGRES_USER:?set POSTGRES_USER}
      - PGDATA=/var/lib/postgresql/data/pgdata
      # Odoo expects the database to be created with the C collate
      - POSTGRES_INITDB_ARGS=--lc-collate=C
      - DOCKER_ODONET_SUBNET=${DOCKER_ODONET_SUBNET:-172.28.0.0/16}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'PGPASSWORD="$${POSTGRES_APP_PASSWORD}" psql -h localhost -U "$${POSTGRES_APP_USER}" -d "$${POSTGRES_DB}" -v ON_ERROR_STOP=1 -qAtc "SELECT COALESCE(bool_and(NOT rolsuper AND rolcreatedb AND NOT rolcreaterole AND NOT rolreplication AND NOT rolbypassrls), false) FROM pg_roles WHERE rolname = current_user" | grep -qx t',
        ]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      odoonet:

volumes:
  odoo-data:
  odoo-testlogs:
  odoo-modules:
  psql:
